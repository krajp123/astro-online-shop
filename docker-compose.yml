# Docker Compose for local development of the e-commerce platform.
# Services: PostgreSQL, MongoDB, shared backend, and all 3 frontend apps.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: ecommerce-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: ecommerce-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - mongo

  customer:
    build: ./frontend/customer
    container_name: ecommerce-customer
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

  seller:
    build: ./frontend/seller
    container_name: ecommerce-seller
    restart: unless-stopped
    ports:
      - "5174:5174"
    depends_on:
      - backend

  admin:
    build: ./frontend/admin
    container_name: ecommerce-admin
    restart: unless-stopped
    ports:
      - "5175:5175"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
